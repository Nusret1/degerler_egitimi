      var UI_FONT = "'Segoe UI', Tahoma, Arial, sans-serif";

      function drawRoundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function drawWrappedText(ctx, text, centerX, startY, maxWidth, lineHeight) {
        var words = text.split(' ');
        var lines = [];
        var currentLine = '';

        for (var i = 0; i < words.length; i++) {
          var testLine = currentLine ? currentLine + ' ' + words[i] : words[i];
          if (ctx.measureText(testLine).width > maxWidth && currentLine) {
            lines.push(currentLine);
            currentLine = words[i];
          } else {
            currentLine = testLine;
          }
        }
        if (currentLine) lines.push(currentLine);

        for (var j = 0; j < lines.length; j++) {
          ctx.fillText(lines[j], centerX, startY + j * lineHeight);
        }
        return lines.length;
      }

      function attachCanvasTextureToMesh(el, canvas) {
        var texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.needsUpdate = true;

        function apply() {
          var mesh = el.getObject3D('mesh');
          if (!mesh) return;
          mesh.material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            side: THREE.FrontSide
          });
          mesh.material.needsUpdate = true;
        }

        apply();
        el.addEventListener('object3dset', function (evt) {
          if (evt.detail.type === 'mesh') apply();
        });

        return texture;
      }

      /* =====================================================================
         VİDEO VE SAHNE YÖNETİMİ

      function startExperience() {
        if (appState.mode !== 'idle') return;

        var vidIntro = document.getElementById('vid-intro');
        var vidLoop = document.getElementById('vid-loop');
        var vidScene = document.getElementById('vid-scene');

        var sphereIntro = document.getElementById('sphere-intro');
        var sphereLoop = document.getElementById('sphere-loop');
        var sphereScene = document.getElementById('sphere-scene');

        appState.mode = 'hub';
        document.getElementById('start-screen').style.display = 'none';

        // VR kontrolcüsü (WebXR) tıklamalarında sesli oynatma izni için
        // döngü ve sahne oynatıcılarını sessizce kilitten çıkarıyoruz.
        [vidLoop, vidScene].forEach(function (v) {
          v.muted = true;
          var p = v.play();
          if (p && p.then) {
            p.then(function () {
              if (v === vidScene && appState.mode === 'scene') {
                v.muted = false;
                return;
              }
              if (v === vidLoop && appState.mode === 'hub' && sphereLoop.getAttribute('visible') === true) {
                v.muted = false;
                return;
              }
              v.pause();
              v.currentTime = 0;
              v.muted = false;
            }).catch(function () {
              v.muted = false;
            });
          } else {
            v.pause();
            v.muted = false;
          }
        });

        // İlk girişte 00_A (Bilge Dede karşılama konuşması) 1 kez oynar
        sphereLoop.setAttribute('visible', 'false');
        sphereScene.setAttribute('visible', 'false');
        sphereIntro.setAttribute('visible', 'true');

        vidIntro.loop = false;
        vidIntro.muted = false;
        vidIntro.currentTime = 0;
        vidIntro.play().catch(function (err) {
          console.log('Giriş videosu başlatılamadı, döngü videosuna geçiliyor:', err);
          activateHubLoop();
        });
      }

      function activateHubLoop() {
        if (appState.mode !== 'hub') return;

        var vidIntro = document.getElementById('vid-intro');
        var vidLoop = document.getElementById('vid-loop');
        var sphereIntro = document.getElementById('sphere-intro');
        var sphereLoop = document.getElementById('sphere-loop');
        var sphereScene = document.getElementById('sphere-scene');

        vidIntro.pause();
        vidLoop.loop = true;
        vidLoop.muted = false;

        sphereLoop.setAttribute('visible', 'true');
        sphereIntro.setAttribute('visible', 'false');
        sphereScene.setAttribute('visible', 'false');

        vidLoop.play().catch(function (e) { console.log(e); });
      }

      function openChapterScene(chapterIdx, sceneIdx) {
        var chapter = CHAPTERS[chapterIdx];
        if (!chapter) return;
        var sceneData = chapter.scenes[sceneIdx] || chapter.scenes[0];

        appState.mode = 'scene';
        appState.activeChapterIdx = chapterIdx;
        appState.activeSceneIdx = sceneIdx;
        appState.sceneEnded = false;

        var vidIntro = document.getElementById('vid-intro');
        var vidLoop = document.getElementById('vid-loop');
        var vidScene = document.getElementById('vid-scene');

        var sphereIntro = document.getElementById('sphere-intro');
        var sphereLoop = document.getElementById('sphere-loop');
        var sphereScene = document.getElementById('sphere-scene');

        // Hub videolarını durdur ve ana menüyü gizle
        vidIntro.pause();
        vidLoop.pause();
        document.getElementById('hub-entities').setAttribute('position', '0 9999 0');

        // Sahne içi kontrolleri ve bilgi noktasını göster, bilgi panelini kapalı tut
        document.getElementById('scene-controls-entity').setAttribute('position', '0 -0.32 -2.45');
        document.getElementById('hotspot-entity').setAttribute('position', '1.85 2.05 -3.0');
        document.getElementById('info-panel-entity').setAttribute('position', '0 9999 0');

        // Alt sahne sekmelerini ve bilgi panelini güncelle
        updateSceneControlsUI();
        updateInfoPanelUI();

        // Sahnenin ana karakterini karşıya hizala ve küreyi görünür yap
        var targetRotY = (typeof sceneData.rotY === 'number') ? sceneData.rotY : -90;
        sphereScene.setAttribute('rotation', '0 ' + targetRotY + ' 0');
        sphereIntro.setAttribute('visible', 'false');
        sphereLoop.setAttribute('visible', 'false');
        sphereScene.setAttribute('visible', 'true');

        // Seçilen sahne videosunu yükle ve 1 kez oynat (döngü kapalı)
        vidScene.pause();
        vidScene.loop = false;
        vidScene.muted = false;

        if (vidScene.getAttribute('data-file') !== sceneData.file) {
          vidScene.setAttribute('data-file', sceneData.file);
          vidScene.src = sceneData.file;
          vidScene.load();
        } else {
          vidScene.currentTime = 0;
        }

        vidScene.play().catch(function (e) { console.log('Sahne oynatma hatası:', e); });
      }

      function replayCurrentScene() {
        if (appState.mode !== 'scene') return;
        var vidScene = document.getElementById('vid-scene');
        appState.sceneEnded = false;
        updateReplayButtonState();
        vidScene.loop = false;
        vidScene.muted = false;
        vidScene.currentTime = 0;
        vidScene.play().catch(function (e) { console.log(e); });
      }

      function returnToHub() {
        var vidScene = document.getElementById('vid-scene');
        vidScene.pause();

        appState.mode = 'hub';
        appState.sceneEnded = false;

        // Sahne arayüzlerini gizle
        document.getElementById('scene-controls-entity').setAttribute('position', '0 9999 0');
        document.getElementById('hotspot-entity').setAttribute('position', '0 9999 0');
        document.getElementById('info-panel-entity').setAttribute('position', '0 9999 0');

        // Ana menüyü geri getir ve 00_B döngü videosunu çalıştır
        document.getElementById('hub-entities').setAttribute('position', '0 0 0');
        activateHubLoop();
      }

      function updateSceneControlsUI() {
        var chapter = CHAPTERS[appState.activeChapterIdx];
        if (!chapter) return;

        for (var i = 0; i < 3; i++) {
          var tabEl = document.getElementById('sub-tab-' + i);
          if (tabEl && tabEl.components['scene-tab-btn']) {
            tabEl.components['scene-tab-btn'].refresh(
              chapter.scenes[i].tabLabel,
              chapter.accent,
              i === appState.activeSceneIdx
            );
          }
        }
        updateReplayButtonState();
      }

      function updateReplayButtonState() {
        var replayEl = document.getElementById('replay-btn');
        var chapter = CHAPTERS[appState.activeChapterIdx];
        if (replayEl && replayEl.components['action-btn'] && chapter) {
          replayEl.components['action-btn'].setHighlight(appState.sceneEnded, chapter.accent);
        }
      }

      function updateInfoPanelUI() {
        var chapter = CHAPTERS[appState.activeChapterIdx];
        if (!chapter) return;
        var sceneData = chapter.scenes[appState.activeSceneIdx];
        var panelEl = document.getElementById('info-panel-bg');
        if (panelEl && panelEl.components['info-panel-canvas']) {
          panelEl.components['info-panel-canvas'].setContent(
            sceneData.heading,
            sceneData.quote,
            sceneData.desc,
            chapter.accent
          );
        }
      }

      /* =====================================================================
         A-FRAME BİLEŞENLERİ (COMPONENTS)
         ===================================================================== */

      // 1. Ana Menü Üst Başlık Tabelası
      AFRAME.registerComponent('hub-header-canvas', {
        init: function () {
          var canvas = document.createElement('canvas');
          canvas.width = 1400;
          canvas.height = 224;
          var ctx = canvas.getContext('2d');

          drawRoundRect(ctx, 8, 8, 1384, 208, 22);
          ctx.fillStyle = 'rgba(8, 8, 10, 0.80)';
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = 'rgba(229, 184, 105, 0.50)';
          ctx.stroke();

          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          ctx.font = '600 46px ' + UI_FONT;
          ctx.fillStyle = '#FFFFFF';
          ctx.fillText('DEĞERLER EĞİTİMİ: ÇINARALTI HATIRALARI', 700, 80);

          ctx.fillStyle = 'rgba(229, 184, 105, 0.5)';
          ctx.fillRect(420, 126, 560, 2);

          ctx.font = '400 29px ' + UI_FONT;
          ctx.fillStyle = '#D8CFC2';
          ctx.fillText('Geçmişin izinde dokunmak istediğiniz değeri seçiniz', 700, 168);

          attachCanvasTextureToMesh(this.el, canvas);
        }
      });

      // 2. Ana Menü Değer Seçim Kartları (6 Adet)
      AFRAME.registerComponent('chapter-card', {
        schema: {
          chapterIndex: { type: 'int', default: 0 }
        },
        init: function () {
          var self = this;
          var el = this.el;
          this.chapter = CHAPTERS[this.data.chapterIndex];
          this.hovered = false;

          this.canvas = document.createElement('canvas');
          this.canvas.width = 940;
          this.canvas.height = 340;
          this.ctx = this.canvas.getContext('2d');
          this.texture = attachCanvasTextureToMesh(el, this.canvas);

          this.draw();

          el.addEventListener('mouseenter', function () {
            self.hovered = true;
            self.draw();
            el.setAttribute('animation', { property: 'scale', to: '1.04 1.04 1.04', dur: 220 });
          });

          el.addEventListener('mouseleave', function () {
            self.hovered = false;
            self.draw();
            el.setAttribute('animation', { property: 'scale', to: '1 1 1', dur: 220 });
          });

          el.addEventListener('click', function () {
            openChapterScene(self.data.chapterIndex, 0);
          });
        },
        draw: function () {
          var ctx = this.ctx;
          var w = this.canvas.width;
          var h = this.canvas.height;
          var ch = this.chapter;

          ctx.clearRect(0, 0, w, h);

          // Kart arka planı
          drawRoundRect(ctx, 8, 8, w - 16, h - 16, 20);
          ctx.fillStyle = this.hovered ? 'rgba(28, 26, 24, 0.94)' : 'rgba(10, 10, 12, 0.84)';
          ctx.fill();

          // Çerçeve
          ctx.lineWidth = this.hovered ? 5 : 3;
          ctx.strokeStyle = this.hovered ? ch.accent : 'rgba(255, 255, 255, 0.24)';
          ctx.stroke();

          // Sol vurgu şeridi
          drawRoundRect(ctx, 26, 36, 10, h - 72, 5);
          ctx.fillStyle = ch.accent;
          ctx.fill();

          // Bölüm numarası rozeti
          drawRoundRect(ctx, 58, 34, 86, 44, 12);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
          ctx.fill();
          ctx.font = '700 25px ' + UI_FONT;
          ctx.fillStyle = ch.accent;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(ch.num, 101, 57);

          // Sağ üst "3 Hatıra" bilgisi
          ctx.font = '400 23px ' + UI_FONT;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
          ctx.textAlign = 'right';
          ctx.fillText('3 Hatıra Sahnesi ›', w - 42, 57);

          // Ana değer başlığı (uzun başlıklarda otomatik boyut sığdırma)
          ctx.textAlign = 'left';
          var titleSize = 38;
          ctx.font = '700 ' + titleSize + 'px ' + UI_FONT;
          while (ctx.measureText(ch.title).width > (w - 100) && titleSize > 26) {
            titleSize -= 1;
            ctx.font = '700 ' + titleSize + 'px ' + UI_FONT;
          }
          ctx.fillStyle = '#FFFFFF';
          ctx.fillText(ch.title, 58, 144);

          // İnce ayırıcı çizgi
          ctx.fillStyle = 'rgba(255, 255, 255, 0.16)';
          ctx.fillRect(58, 188, w - 116, 2);

          // Alt başlık
          ctx.font = '400 30px ' + UI_FONT;
          ctx.fillStyle = ch.accent;
          ctx.fillText(ch.subtitle, 58, 246);

          this.texture.needsUpdate = true;
        }
      });

      // 3. Bölüm İçi Alt Sahne Sekme Butonları (1. Ana / 2. Alt 1 / 3. Alt 2)
      AFRAME.registerComponent('scene-tab-btn', {
        schema: {
          sceneIndex: { type: 'int', default: 0 }
        },
        init: function () {
          var self = this;
          var el = this.el;
          this.label = '';
          this.accent = '#E5B869';
          this.isActive = false;
          this.hovered = false;

          this.canvas = document.createElement('canvas');
          this.canvas.width = 560;
          this.canvas.height = 160;
          this.ctx = this.canvas.getContext('2d');
          this.texture = attachCanvasTextureToMesh(el, this.canvas);

          this.draw();

          el.addEventListener('mouseenter', function () {
            self.hovered = true;
            self.draw();
            el.setAttribute('animation', { property: 'scale', to: '1.05 1.05 1.05', dur: 180 });
          });

          el.addEventListener('mouseleave', function () {
            self.hovered = false;
            self.draw();
            el.setAttribute('animation', { property: 'scale', to: '1 1 1', dur: 180 });
          });

          el.addEventListener('click', function () {
            openChapterScene(appState.activeChapterIdx, self.data.sceneIndex);
          });
        },
        refresh: function (label, accent, isActive) {
          this.label = label;
          this.accent = accent;
          this.isActive = isActive;
          this.draw();
        },
        draw: function () {
          var ctx = this.ctx;
          var w = this.canvas.width;
          var h = this.canvas.height;
          ctx.clearRect(0, 0, w, h);

          drawRoundRect(ctx, 6, 6, w - 12, h - 12, 18);
          if (this.isActive) {
            ctx.fillStyle = 'rgba(35, 32, 28, 0.96)';
          } else if (this.hovered) {
            ctx.fillStyle = 'rgba(40, 40, 45, 0.94)';
          } else {
            ctx.fillStyle = 'rgba(15, 15, 18, 0.88)';
          }
          ctx.fill();

          ctx.lineWidth = this.isActive ? 5 : 3;
          ctx.strokeStyle = (this.isActive || this.hovered) ? this.accent : 'rgba(255, 255, 255, 0.25)';
          ctx.stroke();

          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.font = (this.isActive ? '700 ' : '500 ') + '33px ' + UI_FONT;
          ctx.fillStyle = this.isActive ? this.accent : '#EAEAEA';
          ctx.fillText(this.label, w / 2, h / 2 + 2);

          this.texture.needsUpdate = true;
        }
      });

      // 4. Alt Kontrol Aksiyon Butonları (Tekrar Oynat & Ana Menüye Dön)
      AFRAME.registerComponent('action-btn', {
        schema: {
          label: { type: 'string', default: '' },
          action: { type: 'string', default: 'replay' }
        },
        init: function () {
          var self = this;
          var el = this.el;
          this.hovered = false;
          this.highlighted = false;
          this.accent = '#E5B869';

          this.canvas = document.createElement('canvas');
          this.canvas.width = 760;
          this.canvas.height = 170;
          this.ctx = this.canvas.getContext('2d');
          this.texture = attachCanvasTextureToMesh(el, this.canvas);

          this.draw();

          el.addEventListener('mouseenter', function () {
            self.hovered = true;
            self.draw();
            el.setAttribute('animation', { property: 'scale', to: '1.04 1.04 1.04', dur: 180 });
          });

          el.addEventListener('mouseleave', function () {
            self.hovered = false;
            self.draw();
            el.setAttribute('animation', { property: 'scale', to: '1 1 1', dur: 180 });
          });

          el.addEventListener('click', function () {
            if (self.data.action === 'replay') {
              replayCurrentScene();
            } else if (self.data.action === 'hub') {
              returnToHub();
            }
          });
        },
        setHighlight: function (flag, accent) {
          this.highlighted = flag;
          if (accent) this.accent = accent;
          this.draw();
        },
        draw: function () {
          var ctx = this.ctx;
          var w = this.canvas.width;
          var h = this.canvas.height;
          ctx.clearRect(0, 0, w, h);

          drawRoundRect(ctx, 6, 6, w - 12, h - 12, 18);
          if (this.hovered) {
            ctx.fillStyle = 'rgba(48, 48, 54, 0.96)';
          } else if (this.highlighted) {
            ctx.fillStyle = 'rgba(36, 30, 22, 0.95)';
          } else {
            ctx.fillStyle = 'rgba(20, 20, 24, 0.92)';
          }
          ctx.fill();

          ctx.lineWidth = (this.highlighted || this.hovered) ? 4 : 3;
          ctx.strokeStyle = this.highlighted
            ? this.accent
            : (this.hovered ? '#FFFFFF' : 'rgba(255, 255, 255, 0.32)');
          ctx.stroke();

          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.font = '600 34px ' + UI_FONT;
          ctx.fillStyle = this.highlighted ? this.accent : '#FFFFFF';
          ctx.fillText(this.data.label, w / 2, h / 2 + 2);

          this.texture.needsUpdate = true;
        }
      });

      // 5. Bilgi Noktası ('i' Hotspot)
      AFRAME.registerComponent('hotspot-btn', {
        init: function () {
          var el = this.el;
          var parent = el.parentElement;
          var canvas = document.createElement('canvas');
          canvas.width = 256;
          canvas.height = 256;
          var ctx = canvas.getContext('2d');

          ctx.beginPath();
          ctx.arc(128, 128, 110, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(10, 10, 14, 0.85)';
          ctx.fill();
          ctx.lineWidth = 8;
          ctx.strokeStyle = '#E5B869';
          ctx.stroke();

          ctx.font = 'italic 700 120px Georgia, serif';
          ctx.fillStyle = '#FFFFFF';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('i', 128, 134);

          attachCanvasTextureToMesh(el, canvas);

          el.addEventListener('mouseenter', function () {
            parent.setAttribute('scale', '1.18 1.18 1.18');
          });
          el.addEventListener('mouseleave', function () {
            parent.setAttribute('scale', '1 1 1');
          });
          el.addEventListener('click', function () {
            document.getElementById('info-panel-entity').setAttribute('position', '0 1.55 -2.5');
            parent.setAttribute('position', '0 9999 0');
          });
        }
      });

      // 6. Bilgi Paneli (Türkçe Başlık + Sahnedeki Söz + Değer Açıklaması)
      AFRAME.registerComponent('info-panel-canvas', {
        init: function () {
          this.canvas = document.createElement('canvas');
          this.canvas.width = 1360;
          this.canvas.height = 700;
          this.ctx = this.canvas.getContext('2d');
          this.texture = attachCanvasTextureToMesh(this.el, this.canvas);
          this.setContent(
            CHAPTERS[0].scenes[0].heading,
            CHAPTERS[0].scenes[0].quote,
            CHAPTERS[0].scenes[0].desc,
            CHAPTERS[0].accent
          );
        },
        setContent: function (heading, quote, desc, accent) {
          var ctx = this.ctx;
          var w = this.canvas.width;
          var h = this.canvas.height;
          ctx.clearRect(0, 0, w, h);

          // Ana panel kutusu
          drawRoundRect(ctx, 10, 10, w - 20, h - 20, 26);
          ctx.fillStyle = 'rgba(10, 10, 14, 0.90)';
          ctx.fill();
          ctx.lineWidth = 4;
          ctx.strokeStyle = accent || 'rgba(229, 184, 105, 0.6)';
          ctx.stroke();

          ctx.textAlign = 'center';
          ctx.textBaseline = 'top';

          // Başlık (satır sayısına göre dinamik akış)
          ctx.font = '700 36px ' + UI_FONT;
          ctx.fillStyle = accent || '#E5B869';
          var headingLines = drawWrappedText(ctx, heading, w / 2, 48, w - 230, 46);

          // Ayırıcı çizgi
          var dividerY = 48 + headingLines * 46 + 16;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
          ctx.fillRect(140, dividerY, w - 280, 2);

          // Sahnedeki Söz (Replik)
          var quoteStartY = dividerY + 26;
          ctx.font = 'italic 600 34px ' + UI_FONT;
          ctx.fillStyle = '#FFFFFF';
          var quoteLines = drawWrappedText(ctx, quote, w / 2, quoteStartY, w - 160, 46);

          // Değerler Eğitimi Açıklaması
          var descStartY = quoteStartY + quoteLines * 46 + 28;
          ctx.font = '400 32px ' + UI_FONT;
          ctx.fillStyle = '#D4D4D8';
          drawWrappedText(ctx, desc, w / 2, descStartY, w - 150, 46);

          this.texture.needsUpdate = true;
        }
      });

      // 7. Bilgi Paneli Kapatma ('X') Butonu
      AFRAME.registerComponent('close-panel-btn', {
        init: function () {
          var self = this;
          var el = this.el;
          this.hovered = false;
          this.canvas = document.createElement('canvas');
          this.canvas.width = 160;
          this.canvas.height = 160;
          this.ctx = this.canvas.getContext('2d');
          this.texture = attachCanvasTextureToMesh(el, this.canvas);
          this.draw();

          el.addEventListener('mouseenter', function () {
            self.hovered = true;
            self.draw();
            el.setAttribute('scale', '1.12 1.12 1.12');
          });
          el.addEventListener('mouseleave', function () {
            self.hovered = false;
            self.draw();
            el.setAttribute('scale', '1 1 1');
          });
          el.addEventListener('click', function () {
            document.getElementById('info-panel-entity').setAttribute('position', '0 9999 0');
            document.getElementById('hotspot-entity').setAttribute('position', '1.85 2.05 -3.0');
          });
        },
        draw: function () {
          var ctx = this.ctx;
          ctx.clearRect(0, 0, 160, 160);
          ctx.beginPath();
          ctx.arc(80, 80, 68, 0, Math.PI * 2);
          ctx.fillStyle = this.hovered ? '#C0392B' : '#2C2C32';
          ctx.fill();
          ctx.lineWidth = 5;
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
          ctx.stroke();

          ctx.font = '700 66px ' + UI_FONT;
          ctx.fillStyle = '#FFFFFF';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('✕', 80, 84);
          this.texture.needsUpdate = true;
        }
      });

      /* =====================================================================
         SAYFA YÜKLENDİĞİNDE VİDEO OLAY DİNLEYİCİLERİNİ BAĞLA
         ===================================================================== */
      window.addEventListener('DOMContentLoaded', function () {
        var sceneEl = document.querySelector('a-scene');
        var lastFsToggleTime = 0;

        function togglePageFullscreen() {
          var now = Date.now();
          if (now - lastFsToggleTime < 350) return;
          lastFsToggleTime = now;

          var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
          if (!fsEl) {
            var root = document.documentElement;
            if (root.requestFullscreen) {
              root.requestFullscreen().catch(function () {});
            } else if (root.webkitRequestFullscreen) {
              root.webkitRequestFullscreen();
            }
          } else {
            if (document.exitFullscreen) {
              document.exitFullscreen().catch(function () {});
            } else if (document.webkitExitFullscreen) {
              document.webkitExitFullscreen();
            }
          }
        }

        // Giriş sayfasındayken sağ alttaki büyütme ikonuna basıldığında A-Frame'in yalnızca
        // <canvas> elemanını tam ekran yapıp giriş ekranını arkada bırakmasını engeller;
        // bunun yerine tüm sayfayı (giriş ekranından ayrılmadan) tam ekrana büyütür.
        function isVrHeadsetConnected() {
          try {
            if (sceneEl && typeof sceneEl.checkHeadsetConnected === 'function') {
              return !!sceneEl.checkHeadsetConnected();
            }
            if (window.AFRAME && AFRAME.utils && AFRAME.utils.device && typeof AFRAME.utils.device.checkHeadsetConnected === 'function') {
              return !!AFRAME.utils.device.checkHeadsetConnected();
            }
          } catch (err) {}
          return false;
        }

        function handleFullscreenButton(evt) {
          var t = evt.target;
          if (!t || !t.closest || !t.closest('.a-enter-vr-button, .a-enter-vr')) return;

          if (appState.mode === 'idle' || !isVrHeadsetConnected()) {
            evt.stopImmediatePropagation();
            evt.stopPropagation();
            evt.preventDefault();
            togglePageFullscreen();
          }
        }

        window.addEventListener('click', handleFullscreenButton, true);
        window.addEventListener('touchend', handleFullscreenButton, true);

        if (sceneEl && typeof sceneEl.enterVR === 'function') {
          var originalEnterVR = sceneEl.enterVR.bind(sceneEl);
          sceneEl.enterVR = function () {
            if (appState.mode === 'idle' || !isVrHeadsetConnected()) {
              togglePageFullscreen();
              return Promise.resolve();
            }
            return originalEnterVR.apply(sceneEl, arguments);
          };
        }

        function onFullscreenResize() {
          if (sceneEl && sceneEl.resize) {
            sceneEl.resize();
          }
        }
        document.addEventListener('fullscreenchange', onFullscreenResize);
        document.addEventListener('webkitfullscreenchange', onFullscreenResize);

        var vidIntro = document.getElementById('vid-intro');
        var vidScene = document.getElementById('vid-scene');
        var sphereScene = document.getElementById('sphere-scene');
        var lastSceneW = 0;
        var lastSceneH = 0;

        // 00_A karşılama videosu bittiği anda kesintisiz 00_B döngü videosuna geç
        vidIntro.addEventListener('ended', function () {
          activateHubLoop();
        });

        // Sahne videosunun çözünürlüğü değiştiğinde GPU dokusunu güvenle yenile
        vidScene.addEventListener('loadeddata', function () {
          var mesh = sphereScene.getObject3D('mesh');
          if (!mesh || !mesh.material) return;
          var vw = vidScene.videoWidth || 0;
          var vh = vidScene.videoHeight || 0;
          if (!mesh.material.map || (vw > 0 && (vw !== lastSceneW || vh !== lastSceneH))) {
            lastSceneW = vw;
            lastSceneH = vh;
            if (mesh.material.map) {
              mesh.material.map.dispose();
            }
            var freshTex = new THREE.VideoTexture(vidScene);
            freshTex.minFilter = THREE.LinearFilter;
            freshTex.magFilter = THREE.LinearFilter;
            freshTex.needsUpdate = true;
            mesh.material.map = freshTex;
            mesh.material.needsUpdate = true;
          } else if (mesh.material.map) {
            mesh.material.map.needsUpdate = true;
          }
        });

        // Bölüm videosu bittiğinde durur; "Tekrar Oynat" butonunu vurgular
        vidScene.addEventListener('ended', function () {
          if (appState.mode === 'scene') {
            appState.sceneEnded = true;
            updateReplayButtonState();
          }
        });
      });
    </script>
  </head>

  <body>
    <!-- BAŞLANGIÇ EKRANI -->
    <div id="start-screen">
      <div class="badge-top">360° Sanal Gerçeklik Deneyimi</div>
      <div class="title-main">DEĞERLER EĞİTİMİ: ÇINARALTI HATIRALARI</div>
      <div class="title-sub">
        Asırlık çınarın gölgesinde, bizi biz yapan kültürel ve insani değerlerimize<br>
        geçmişin izinde bir yolculuk
      </div>
      <button id="start-button" onclick="startExperience()">GİRİŞ YAP</button>
    </div>

    <!-- Sağ alt köşe imzası -->
    <div id="signature">by Nesretullah SATAR</div>

    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clickable">

      <a-assets timeout="8000">
        <!-- Merkez (Hub) 1. Video: Karşılama konuşması (Sadece ilk girişte 1 kez oynar) -->
        <video id="vid-intro" src="00_A_ANA_MENU_GIRIS.mp4" preload="auto" playsinline webkit-playsinline></video>
        <!-- Merkez (Hub) 2. Video: Bilge Dede saz döngüsü (Menü seçimi yapılana kadar döngüde kalır) -->
        <video id="vid-loop" src="00_B_ANA_MENU_LOOP.mp4" preload="auto" playsinline webkit-playsinline loop></video>
        <!-- Bölüm & Alt Sahne Oynatıcısı: Seçilen sahneyi 1 kez oynatır, tuşa basınca tekrar çalışır -->
        <video id="vid-scene" src="01_YARDIMLASMA_ANA.mp4" preload="metadata" playsinline webkit-playsinline></video>
      </a-assets>

      <!-- KAMERA VE VR KONTROLCÜLERİ -->
      <a-entity id="camera-rig">
        <a-camera position="0 1.6 0"></a-camera>
        <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 20"></a-entity>
        <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 20"></a-entity>
      </a-entity>

      <a-light type="ambient" color="#FFFFFF" intensity="1.0"></a-light>

      <!-- 360° VİDEO KÜRELERİ (00_A ve 00_B videolarında Bilge Dede tam merkeze hizalı) -->
      <a-videosphere id="sphere-intro" src="#vid-intro" radius="100" rotation="0 -68 0" visible="true"></a-videosphere>
      <a-videosphere id="sphere-loop" src="#vid-loop" radius="100" rotation="0 -114 0" visible="false"></a-videosphere>
      <a-videosphere id="sphere-scene" src="#vid-scene" radius="100" rotation="0 -90 0" visible="false"></a-videosphere>

      <!-- ===============================================================
           ANA MENÜ (HUB) - BİLGE DEDE'Yİ ORTADA TAMAMEN AÇIK BIRAKAN GENİŞ KANAT DÜZENİ
           =============================================================== -->
      <a-entity id="hub-entities" position="0 0 0">

        <!-- Üst Başlık (Çınar yaprakları hizasında, Bilge Dede ve kartlarla çakışmaz) -->
        <a-plane width="3.5" height="0.56" position="0 4.32 -4.4" rotation="18 0 0" material="shader: flat; transparent: true" hub-header-canvas></a-plane>

        <!-- SOL KANAT (01, 02, 03) -->
        <a-plane class="clickable" width="1.88" height="0.68" position="-3.55 2.82 -4.05" rotation="8 34 0" material="shader: flat; transparent: true" chapter-card="chapterIndex: 0"></a-plane>
        <a-plane class="clickable" width="1.88" height="0.68" position="-3.65 1.94 -4.05" rotation="2 34 0" material="shader: flat; transparent: true" chapter-card="chapterIndex: 1"></a-plane>
        <a-plane class="clickable" width="1.88" height="0.68" position="-3.55 1.06 -4.05" rotation="-4 34 0" material="shader: flat; transparent: true" chapter-card="chapterIndex: 2"></a-plane>

        <!-- SAĞ KANAT (04, 05, 06) -->
        <a-plane class="clickable" width="1.88" height="0.68" position="3.55 2.82 -4.05" rotation="8 -34 0" material="shader: flat; transparent: true" chapter-card="chapterIndex: 3"></a-plane>
        <a-plane class="clickable" width="1.88" height="0.68" position="3.65 1.94 -4.05" rotation="2 -34 0" material="shader: flat; transparent: true" chapter-card="chapterIndex: 4"></a-plane>
        <a-plane class="clickable" width="1.88" height="0.68" position="3.55 1.06 -4.05" rotation="-4 -34 0" material="shader: flat; transparent: true" chapter-card="chapterIndex: 5"></a-plane>

      </a-entity>

      <!-- ===============================================================
           BİLGİ SİSTEMİ ('i' HOTSPOT VE BİLGİ PANELİ)
           =============================================================== -->
      <a-entity id="hotspot-entity" position="0 9999 0" rotation="10 -28 0">
        <a-ring color="#E5B869" radius-inner="0.14" radius-outer="0.18" opacity="0.75" material="shader: flat"
                animation="property: scale; to: 1.22 1.22 1.22; dir: alternate; dur: 850; loop: true"></a-ring>
        <a-plane class="clickable" width="0.28" height="0.28" position="0 0 0.01" material="shader: flat; transparent: true" hotspot-btn></a-plane>
      </a-entity>

      <a-entity id="info-panel-entity" position="0 9999 0">
        <a-plane id="info-panel-bg" width="3.4" height="1.75" material="shader: flat; transparent: true" info-panel-canvas></a-plane>
        <a-plane class="clickable" width="0.28" height="0.28" position="1.48 0.66 0.02" material="shader: flat; transparent: true" close-panel-btn></a-plane>
      </a-entity>

      <!-- ===============================================================
           SAHNE İÇİ ALT KONTROL PANELİ (3 ALT SAHNE SEKMESİ + TEKRAR OYNAT + ANA MENÜ)
           =============================================================== -->
      <a-entity id="scene-controls-entity" position="0 9999 0" rotation="-22 0 0">
        <!-- Üst Satır: O Değere Ait 3 Hatıra Sahnesi -->
        <a-plane id="sub-tab-0" class="clickable" width="1.06" height="0.29" position="-1.12 0.18 0" material="shader: flat; transparent: true" scene-tab-btn="sceneIndex: 0"></a-plane>
        <a-plane id="sub-tab-1" class="clickable" width="1.06" height="0.29" position="0 0.18 0" material="shader: flat; transparent: true" scene-tab-btn="sceneIndex: 1"></a-plane>
        <a-plane id="sub-tab-2" class="clickable" width="1.06" height="0.29" position="1.12 0.18 0" material="shader: flat; transparent: true" scene-tab-btn="sceneIndex: 2"></a-plane>

        <!-- Alt Satır: Tekrar Oynat & Ana Menüye Dön -->
        <a-plane id="replay-btn" class="clickable" width="1.58" height="0.33" position="-0.83 -0.18 0" material="shader: flat; transparent: true"
                 action-btn="label: ↻  Videoyu Tekrar Oynat; action: replay"></a-plane>
        <a-plane id="hub-return-btn" class="clickable" width="1.58" height="0.33" position="0.83 -0.18 0" material="shader: flat; transparent: true"
                 action-btn="label: ↩  Ana Menüye Dön; action: hub"></a-plane>
      </a-entity>

    </a-scene>
  </body>
</html>
